<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCNYC · Mahjong</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050203;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        color: #e8d9b6;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #canvas {
        display: block;
        height: 100vh;
        aspect-ratio: 9 / 16;
        max-width: 100vw;
        box-shadow: 0 0 80px rgba(0, 0, 0, 0.7);
      }
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        background: radial-gradient(ellipse at center, rgba(20, 8, 10, 0.85), rgba(0, 0, 0, 0.95));
        cursor: pointer;
        z-index: 10;
        transition: opacity 600ms ease;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }
      #start.hidden { opacity: 0; pointer-events: none; }
      #start .title {
        font-size: clamp(1.2rem, 2.5vw, 2rem);
        color: #d8b56b;
        text-shadow: 0 0 18px rgba(216, 181, 107, 0.45);
      }
      #start .hint {
        font-size: 0.8rem;
        opacity: 0.55;
      }
      .pulse {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #d8b56b;
        box-shadow: 0 0 20px #d8b56b, 0 0 40px rgba(216, 181, 107, 0.4);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.7; }
        50%      { transform: scale(1.15); opacity: 1; }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Long+Cang&display=swap"
      rel="stylesheet"
    />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </div>

    <div id="start" role="button" tabindex="0">
      <div class="pulse"></div>
      <div class="title">CCNYC · Mahjong</div>
      <div class="hint">click to play</div>
    </div>


    <script type="module" src="./src/main.js"></script>
  </body>
</html>
